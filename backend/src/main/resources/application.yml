server:
  port: 8080

spring:
  application:
    name: payroll-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/payroll_db}
    username: ${SPRING_DATASOURCE_USERNAME:payroll}
    password: ${SPRING_DATASOURCE_PASSWORD:payroll123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6381}
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.payroll: INFO
    org.flywaydb: INFO
